services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Reach the host's Ollama from inside the container.
      OLLAMA_URL: "http://host.docker.internal:11434"
      DATABASE_URL: "sqlite:///./dispatch.db"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      # Mount source for live reload; keep deps/db out of the bind mount.
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
